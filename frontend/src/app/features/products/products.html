<div class="w-full min-h-screen bg-indigo-50 flex gap-4 mt-10 px-4 pb-8" dir="rtl">
  <div class="filters_products flex  basis-2/6 shrink-0">
    <app-filter-products (filtersChange)="onFiltersChange($event)" />
  </div>

  <div class="flex flex-col basis-4/6 gap-4 min-w-0">
    <div class="filter_product flex flex-wrap gap-2 items-center bg-white rounded-xl p-3 shadow-sm">
      <span class="text-sm text-slate-500 ml-2">مرتب‌سازی:</span>
      @for (item of filter_button_info; track item.id) {
        <p-button
          [label]="item.name"
          [outlined]="selectedSortId !== item.id"
          (onClick)="selectSort(item)"
        />
      }
    </div>

    <div class="products_view flex-wrap  flex  place-content-center-safe bg-white rounded-xl  shadow-sm min-h-[400px]">
      @for (product of newProducts; track product.id) {
        <div class="basis-1/2 md:basis-1/3 lg:basis-1/5">

        
          <app-card-products 
        [product]="product">
      </app-card-products>
        
        </div>
      }
    </div>
  </div>
</div>
