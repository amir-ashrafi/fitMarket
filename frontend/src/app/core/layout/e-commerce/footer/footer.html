            <div class="flex input_footer space-x-2 justify-center mt-5 mb-3 items-center">
                <p-floatlabel variant="on">
                    <input
                      pInputText
                      
                      id="email"
                      type="email"
                      [(ngModel)]="email"
                      #emailModel="ngModel"
                      required
                      email
                      class="w-full h-10 border-b"
                    />
                    <label class="text-xs " for="email">
                      برای محصولات جدید ایمیلتان را وارد کنید
                    </label>
                  </p-floatlabel>
                    <p-button
                        icon="pi pi-chevron-left"
                        severity="primary"
                    />
            </div>
            <div class="flex  justify-center mt-2 mb-4">
                <div class="flex my-4 button_icon_footer space-x-2">
                    @for (item of icon; track item.id) {
                        <p-button [icon]="item.name" [rounded]="true" [text]="true" />
                    }
                </div>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 place-items-start gap-4">
            @for (items of footer_items; track items.id) {
                <ul class="flex flex-col gap-2">
                    <span class="font-bold text-xl mb-2">{{items.name}}</span>
                    @for (item of items.children; track item.id) {
                        <a [routerLink]="item.link">
                            <li>
                                {{item.name}}
                            </li>
                        </a>
                    }
                </ul>
            }
        </div>
    </div>
    
</div>
