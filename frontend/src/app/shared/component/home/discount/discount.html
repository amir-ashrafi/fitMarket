<div class="flex bg-purple-700    w-full flex-col max-w-[1440px] md:rounded-tr-2xl md:rounded-br-2xl" dir="rtl">
    <div class="flex justify-between px-5 md:hidden">
        <div class="flex px-5 py-2 pt-4 space-x-2 items-center">
            <span class="text-3xl font-playful font-extrabold">%</span>
            <h1 class="font-playful text-2xl inline-block text-right font-bold max-w-40">شگفت انگیز</h1>
        </div>
            <button pButton routerLink="/products" class=" cursor-pointer py-1 flex items-center"> 
                <span class="">
                همه
                </span>
                <svg class="text-white" size="30" data-p-icon="angle-left"></svg>
            </button>
    </div>
    <div class="flex mr-5 md:py-3 w-auto overflow-x-auto overflow-hidden  custom-scroll">
        <div class=" justify-start flex-col  px-5 md:flex hidden">
            <div class="flex flex-col px-5 py-2 mt-8 mb-3 pt-4 items-center ">
                <span class="text-5xl font-playful mb-3 font-extrabold">%</span>
                <h1 class="font-playful text-4xl inline-block text-right font-bold">شگفت انگیز</h1>
            </div>
                <button pButton routerLink="/products" class="rounded-lg w-32 justify-center bg-white cursor-pointer py-1 flex items-center"> 
                    <span class="text-gray-800 pr-2">
                         مشاهده همه
                    </span>
                    <svg class="text-gray-900" size="30" data-p-icon="angle-left"></svg>
                </button>
        </div>
      @for (product of newProducts; track product.id) {
        <app-card-products 
        [product]="product">
      </app-card-products>
      }
      
    </div>
      
</div>
