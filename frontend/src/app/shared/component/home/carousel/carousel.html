<div class="mt-16 md:mt-0">
    <p-carousel class="w-full max-w-xl md:max-w-none mx-auto relative block" align="center">
        <p-carousel-content
            class="h-60 md:h-[500px] lg:h-[600px] lg:overflow-hidden px-8 md:px-0"
        >
            @for (item of items; track item.name) {
                <p-carousel-item class="px-1.5 md:px-0">
                    <a [href]="item.link || null" class="relative h-full flex flex-col items-center justify-center gap-6 rounded-xl md:rounded-none border border-surface overflow-hidden">
                        <div
                            class="absolute inset-0 bg-cover bg-center scale-110 blur-md opacity-70"
                            [style.background-image]="'url(' + item.name + ')'"
                        ></div>
                        <div class="absolute inset-0 bg-black/50"></div>
                        <img
                            class="relative z-10 h-full w-full object-contain lg:h-[600px] md:h-[500px]"
                            [src]="item.name"
                            alt=""
                        />
                    </a>
                </p-carousel-item>
            }
        </p-carousel-content>

        <div class="absolute hidden md:flex bottom-3 left-4 justify-center mt-4">
            <p-carousel-indicators></p-carousel-indicators>
        </div>

        <button
            pCarouselPrev
            class="hidden md:flex absolute top-1/2 left-4 -translate-y-1/2 w-10 h-10 items-center justify-center rounded-full border border-surface bg-surface-0/70 dark:bg-surface-800/70 backdrop-blur-sm text-surface-500 dark:text-surface-400 hover:opacity-75 cursor-pointer transition-opacity z-10"
        >
            <svg data-p-icon="chevron-left"></svg>
        </button>
        <button
            pCarouselNext
            class="hidden md:flex absolute top-1/2 right-4 -translate-y-1/2 w-10 h-10 items-center justify-center rounded-full border border-surface bg-surface-0/70 dark:bg-surface-800/70 backdrop-blur-sm text-surface-500 dark:text-surface-400 hover:opacity-75 cursor-pointer transition-opacity z-10"
        >
            <svg data-p-icon="chevron-right"></svg>
        </button>
    </p-carousel>
</div>
