
<section dir="rtl" class="max-w-[1600px] mx-auto px-3 sm:px-4 py-6">

    <div class="grid grid-cols-1 lg:grid-rows-1 gap-4">
        <div class="lg:grid-cols-12 grid grid-cols-2 gap-4 lg:gap-10 items-center justify-center 
         md:px-10 lg:px-0">
            @for (card of cards; track card.link) {
                <a
                    [routerLink]="[card.link]"
                    class="relative rounded-2xl overflow-hidden block
                           [&:nth-child(3)]:col-span-2
                           lg:col-span-3 lg:row-span-2
                           lg:[&:nth-child(3)]:col-span-6
                           lg:[&:nth-child(3)]:row-span-4"
                >
                    <img
                        [src]="card.image"
                        [alt]="card.alt"
                        class="w-full h-full object-contain"
                    />
                </a>
            }
        </div>

    </div>
  
    <div class="mt-4 bg-white rounded-2xl border-2 shadow-purple-600 border-purple-600 shadow-sm px-4 sm:px-6 py-6">
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6">
        @for (icon of icons; track icon.title) {
          <a [routerLink]="[icon.link]" class="flex items-center gap-3 group">
            <div class="w-11 h-11 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center shrink-0 group-hover:border-purple-300 transition-colors">
              <img [src]="icon.image" alt="">
            </div>
            <div class="min-w-0">
              <div class="text-sm font-semibold text-gray-900 truncate">{{ icon.title }}</div>
              <div class="text-xs text-gray-500 truncate">{{ icon.subtitle }}</div>
            </div>
          </a>
        }
      </div>
    </div>
  
  </section>
